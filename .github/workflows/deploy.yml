name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
```

4. Click **Commit changes**

---

### Step 5 — Enable GitHub Pages

1. Go to your repo → **Settings → Pages**
2. Under **Branch**, select `gh-pages` and folder `/ (root)`
3. Click **Save**

---

### Step 6 — Wait ~60 seconds

GitHub is now building your app. You can watch it happen under the **Actions** tab in your repo — you'll see a yellow dot (running) turn into a green tick (done).

Your site will then be live at:
```
https://YOUR_USERNAME.github.io/satzbau-pro/
